# SPlayer-Next Docker Compose
#
# 单容器部署：TS API (8080) + Go Subsonic (8081，通过 8080 代理)
#
# 快速开始：
#   docker compose up -d              # 构建并启动
#   docker compose logs -f            # 查看日志
#   docker compose down               # 停止
#
# 国内加速构建：
#   CN_MIRROR=1 docker compose up -d  # 使用国内镜像源
#
# 自定义配置（可选）：
#   cp .env.example .env              # 编辑 .env 修改参数

services:
  splayer:
    image: splayer-next:${SPLAYER_ARCH:-amd64}
    build:
      context: .
      dockerfile: ${SPLAYER_DOCKERFILE:-Dockerfile}
      args:
        # 构建并发数，按 CPU 核心数调整
        BUILD_JOBS: ${BUILD_JOBS:-1}
        # 国内加速：=1 时使用阿里云/国内镜像源
        CN_MIRROR: ${CN_MIRROR:-0}
    container_name: splayer-next
    restart: unless-stopped

    ports:
      # Web UI + Subsonic API（Go 后端通过 8080 代理访问）
      - "${SPLAYER_PORT:-8080}:8080"
      # 如需直接访问 Go Subsonic 原生端口（不推荐）：
      # - "8081:8081"

    volumes:
      # ── 数据持久化（必选）：SQLite 数据库 / 配置 / 缓存 ──
      - ./data:/app/data

      # ── 刮削整理目录（可选）：刮削后按规则整理到此目录 ──
      - ./scrape:/app/scrape

      # ── 音乐文件目录（至少挂载一个，支持多层子目录）──
      # 示例：本地相对路径
      - ./music:/app/music:ro
      # 示例：绝对路径（取消注释使用）
      # - /path/to/your/music:/app/music/本地音乐:ro
      # 示例：多音乐源
      # - /mnt/hdd1/无损:/app/music/无损:ro
      # - /mnt/hdd2/流行:/app/music/流行:ro

    environment:
      NODE_ENV: production
      PORT: 8080
      SPA_DIR: /app/public
      SPLAYER_DATA_DIR: /app/data
      SPLAYER_MUSIC_DIR: /app/music
      SPLAYER_SCRAPE_DIR: /app/scrape

      # 加密密钥（生产环境请更换为随机字符串）
      PROXY_KEY: ${PROXY_KEY:-dev-proxy-key}
      SPLAYER_ENCRYPTION_KEY: ${SPLAYER_ENCRYPTION_KEY:-}

      # Go Subsonic 后端地址（容器内通信，无需修改）
      SPLAYER_SUBSONIC_BACKEND_URL: http://127.0.0.1:8081

      # 时区
      TZ: ${TZ:-Asia/Shanghai}

    # 资源限制（按需调整）
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-512M}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Subsonic 客户端连接信息：
    #   服务器 URL: http://<你的IP>:8080
    #   首次访问：设置 → 流媒体 → 初始化管理员账号
