# SPlayer-Next 生产环境 Nginx 反代配置（可选）
# 用途：SSL 终止 / gzip / 静态资源缓存 / WebSocket 透传
# 用法：将此文件放到 nginx 配置目录，或 docker-compose 加 nginx 服务

upstream splayer_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # 重定向到 HTTPS（启用 SSL 时取消注释）
    # return 301 https://$host$request_uri;

    # 静态资源大文件缓存（音频流由后端 Range serve，不在此缓存）
    location /assets/ {
        proxy_pass http://splayer_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }

    # API 与 SPA fallback 全部转发到后端单端口
    location / {
        proxy_pass http://splayer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（server 端 WS 控制通道）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 音频流可能较大，关闭缓冲边播边传
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
}

